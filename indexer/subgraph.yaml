specVersion: 1.0.0
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto

dataSources:
  - kind: ethereum
    name: FileRegistry
    network: sepolia
    source:
      address: "0x414117f52c51849B174545839780B85E672A1cdE"
      abi: FileRegistry
      startBlock: 9025909
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - File
        - Share
      abis:
        - name: FileRegistry
          file: ./abis/FileRegistry.json
      eventHandlers:
        - event: FileRegistered(indexed bytes32,indexed address,bytes,bytes,bytes32[4],uint256)
          handler: handleFileRegistered
        - event: FileShared(indexed bytes32,indexed address,indexed address,bytes32[4],uint256)
          handler: handleFileShared
      file: ./src/file-registry.ts
