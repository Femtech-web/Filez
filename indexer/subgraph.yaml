specVersion: 1.0.0
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto

dataSources:
  - kind: ethereum
    name: FileRegistryV2
    network: hardhat
    source:
      # TODO: Update this address after deploying FileRegistryV2Optimized contract
      address: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      abi: FileRegistryV2
      # TODO: Update startBlock to deployment block number
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - File
        - Share
        - AccessEvent
        - RevocationEvent
        - User
        - GlobalStats
      abis:
        - name: FileRegistryV2
          file: ./abis/FileRegistryV2.json
      eventHandlers:
        # Core file operations
        - event: FileRegistered(indexed bytes32,indexed address,bytes,bytes,bytes32[4],uint256)
          handler: handleFileRegistered

        # Sharing with expiration support (updated signature)
        - event: FileShared(indexed bytes32,indexed address,indexed address,bytes32[4],uint256,uint256)
          handler: handleFileShared

        # New V2 events
        - event: AccessRevoked(indexed bytes32,indexed address,indexed address,uint256)
          handler: handleAccessRevoked

        - event: FileAccessed(indexed bytes32,indexed address,uint256)
          handler: handleFileAccessed

        - event: FileDeleted(indexed bytes32,indexed address,uint256)
          handler: handleFileDeleted

        - event: MetadataUpdated(indexed bytes32,bytes,uint256)
          handler: handleMetadataUpdated

        - event: ShareExtended(indexed bytes32,indexed address,uint256,uint256,uint256)
          handler: handleShareExtended
      file: ./src/file-registry.ts
